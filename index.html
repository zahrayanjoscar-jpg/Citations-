s la montagne que l’on conquiert, mais soi-même.","Edmund Hillary",2,0],["La discipline est le pont entre les objectifs et les accomplissements.","Attribué à Jim Rohn",0,0],["Celui qui déplace une montagne commence par déplacer de petites pierres.","Attribué à Confucius",2,0],["Le meilleur moyen de prédire l’avenir, c’est de le créer.","Attribué à Peter Drucker",4,0],["Un objectif sans plan n’est qu’un souhait.","Attribué à Saint-Exupéry",4,0],["Pour ce qui est de l’avenir, il ne s’agit pas de le prévoir, mais de le rendre possible.","Antoine de Saint-Exupéry",2,0],["Il est bien plus difficile de se juger soi-même que de juger autrui.","Antoine de Saint-Exupéry",3,0],["L’homme n’est rien d’autre que ce qu’il se fait.","Jean-Paul Sartre",4,0],["Connais-toi toi-même.","Socrate",4,0],["La vie est un défi, relève-le.","Mère Teresa",1,0],["La vie est trop courte pour être petite.","Benjamin Disraeli",2,0],["Le plus grand risque est de ne prendre aucun risque.","Mark Zuckerberg",1,0],["Seuls ceux qui prennent le risque d’aller trop loin peuvent découvrir jusqu’où on peut aller.","T. S. Eliot",1,0],["Il n’y a que deux jours dans l’année où l’on ne peut rien faire : hier et demain.","Attribué au Dalaï-lama",0,0],["Si tu veux aller vite, marche seul. Si tu veux aller loin, marchons ensemble.","Proverbe africain",4,0],["La vie, c’est comme une bicyclette : il faut avancer pour ne pas perdre l’équilibre.","Attribué à Albert Einstein",2,0],["Ce que tu fais aujourd’hui peut améliorer tous tes lendemains.","Ralph Marston",4,0],["Tu as le pouvoir sur ton esprit, pas sur les événements extérieurs. Prends-en conscience et tu trouveras la force.","Attribué à Marc Aurèle",1,0],["La patience est amère, mais son fruit est doux.","Jean-Jacques Rousseau",2,0],["Patience et longueur de temps font plus que force ni que rage.","Jean de La Fontaine",1,0],["Rome ne s’est pas faite en un jour.","Proverbe",2,0],["La nature ne fait rien en hâte et pourtant tout s’accomplit.","Attribué à Lao Tseu" e pas ce qui est fini. Souris, parce que c’est arrivé.","Attribué au Dr Seuss",5,0],["Vis comme si tu devais mourir demain, apprends comme si tu devais vivre toujours.","Attribué à Gandhi",5,0],["Ne t’ai-je pas donné cet ordre : Fortifie-toi et prends courage ? Ne t’effraie point et ne t’épouvante point, car l’Éternel, ton Dieu, est avec toi dans tout ce que tu entreprendras.","Josué 1:9 · Louis Segond",1,1],["Je puis tout par celui qui me fortifie.","Philippiens 4:13 · Louis Segond",1,1],["Mais ceux qui se confient en l’Éternel renouvellent leur force. Ils prennent le vol comme les aigles ; ils courent, et ne se lassent point, ils marchent, et ne se fatiguent point.","Ésaïe 40:31 · Louis Segond",2,1],["Confie-toi en l’Éternel de tout ton cœur, et ne t’appuie pas sur ta sagesse ; reconnais-le dans toutes tes voies, et il aplanira tes sentiers.","Proverbes 3:5-6 · Louis Segond",6,1],["Dieu est pour nous un refuge et un appui, un secours qui ne manque jamais dans les détresses.","Psaume 46:2 · Louis Segond",6,1],["L’Éternel est mon berger : je ne manquerai de rien.","Psaume 23:1 · Louis Segond",6,1],["Ne crains rien, car je suis avec toi ; ne promène pas des regards inquiets, car je suis ton Dieu ; je te fortifie, je viens à ton secours.","Ésaïe 41:10 · Louis Segond",1,1],["Ne nous lassons pas de faire le bien ; car nous moissonnerons au temps convenable, si nous ne nous relâchons pas.","Galates 6:9 · Louis Segond",2,1],["Recommande à l’Éternel tes œuvres, et tes projets se réaliseront.","Proverbes 16:3 · Louis Segond",0,1],["Car je connais les projets que j’ai formés sur vous, dit l’Éternel, projets de paix et non de malheur, afin de vous donner un avenir et de l’espérance.","Jérémie 29:11 · Louis Segond",6,1],["Ne vous inquiétez donc pas du lendemain ; car le lendemain aura soin de lui-même. À chaque jour suffit sa peine.","Matthieu 6:34 · Louis Segond",5,1],["Garde ton cœur plus que toute autre chose, car de lui viennent les sources de la vie.","Proverbes 4:23 · Louis Segond",4,1],["Ne vous conformez pas au siècle présent, mais soyez transformés par le renouvellement de l’intelligence.","Romains 12:2 · Louis Segond",4,1],["Que la patience accomplisse parfaitement son œuvre, afin que vous soyez parfaits et accomplis, sans faillir en rien.","Jacques 1:4 · Louis Segond",2,1],["L’affliction produit la persévérance, la persévérance la victoire dans l’épreuve, et cette victoire l’espérance.","Romains 5:3-4 · Louis Segond",2,1],["Il y a un temps pour tout, un temps pour toute chose sous les cieux.","Ecclésiaste 3:1 · Louis Segond",2,1],["C’est ici la journée que l’Éternel a faite : qu’elle soit pour nous un sujet d’allégresse et de joie !","Psaume 118:24 · Louis Segond",5,1],["Tout ce que vous faites, faites-le de bon cœur, comme pour le Seigneur et non pour des hommes.","Colossiens 3:23 · Louis Segond",0,1],["Car ce n’est pas un esprit de timidité que Dieu nous a donné, mais un esprit de force, d’amour et de sagesse.","2 Timothée 1:7 · Louis Segond",1,1],["Tout travail procure l’abondance, mais les paroles en l’air ne mènent qu’à la disette.","Proverbes 14:23 · Louis Segond",0,1],["Demandez, et l’on vous donnera ; cherchez, et vous trouverez ; frappez, et l’on vous ouvrira.","Matthieu 7:7 · Louis Segond",3,1],["Remets ton sort à l’Éternel, mets en lui ta confiance, et il agira.","Psaume 37:5 · Louis Segond",6,1],["Veillez, demeurez fermes dans la foi, soyez des hommes, fortifiez-vous.","1 Corinthiens 16:13 · Louis Segond",1,1],["L’Éternel est ma lumière et mon salut : de qui aurais-je crainte ?","Psaume 27:1 · Louis Segond",1,1],["Car sept fois le juste tombe, et il se relève.","Proverbes 24:16 · Louis Segond",1,1],["Enseigne-nous à bien compter nos jours, afin que nous appliquions notre cœur à la sagesse.","Psaume 90:12 · Louis Segond",4,1],["Tout est possible à celui qui croit.","Marc 9:23 · Louis Segond",3,1],["Les bontés de l’Éternel ne sont pas épuisées, ses compassions ne sont pas à leur terme ; elles se renouvellent chaque matin. Oh ! que ta fidélité est grande !","Lamentations 3:22-23 · Louis Segond",5,1],["Déchargez-vous sur lui de tous vos soucis, car lui-même prend soin de vous.","1 Pierre 5:7 · Louis Segond",6,1],["Tout ce que ta main trouve à faire avec force, fais-le.","Ecclésiaste 9:10 · Louis Segond",0,1],["Je lève mes yeux vers les montagnes… D’où viendra mon secours ? Mon secours vient de l’Éternel, qui a fait les cieux et la terre.","Psaume 121:1-2 · Louis Segond",6,1]];
var TH=['Discipline','Courage','Patience','Confiance','Sagesse','Vie','Foi'];
var $=function(s){return document.querySelector(s)};
var FK='citations-fav',st={fav:[],th:-1,free:false,hist:[],bag:[]};
try{var r=JSON.parse(localStorage.getItem(FK));if(Array.isArray(r))st.fav=r}catch(e){}
function saveFav(){try{localStorage.setItem(FK,JSON.stringify(st.fav))}catch(e){toast('Enregistrement impossible : stockage bloqué.')}}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('show')},2400)}
function pool(){var p=[];ALL.forEach(function(x,i){if(st.th<0||x[2]===st.th)p.push(i)});return p.length?p:ALL.map(function(x,i){return i})}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function perm(p){var r=rng(20261118),a=p.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function hourIdx(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/36e5)}
function hourPick(){var a=perm(pool());return a[hourIdx()%a.length]}
function nextFree(){if(!st.bag.length){st.bag=perm(pool().map(function(i){return i}));var r=rng(Date.now()),b=st.bag;for(var i=b.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),x=b[i];b[i]=b[j];b[j]=x}}return st.bag.pop()}
var cur=-1;
function isFav(i){return st.fav.indexOf(ALL[i][0])>-1}
function paint(i){
cur=i;var x=ALL[i],t=$('#t');t.innerHTML='';
x[0].split(/(\s+)/).forEach(function(w,k){var s=document.createElement('span');s.textContent=w;s.style.animationDelay=(k*22)+'ms';t.appendChild(s)});
$('#au').textContent=x[1]||'';$('#au').style.display=x[1]?'':'none';
$('#tag').textContent=(x[3]?'Parole · ':'')+TH[x[2]];
$('#bH').textContent=isFav(i)?'♥':'♡';$('#bH').classList.toggle('on',isFav(i));
$('#mk').textContent=x[3]?'✦':'“'}
function show(i,push){var q=$('#q');q.classList.add('out');setTimeout(function(){if(push&&cur>-1)st.hist.push(cur);paint(i);q.classList.remove('out')},320)}
function nextQ(){st.free=true;show(nextFree(),true);tick()}
function prevQ(){if(st.hist.length){st.free=true;show(st.hist.pop(),false)}}
function goHour(){st.free=false;show(hourPick(),false);tick()}
function tick(){var d=new Date(),h=d.getHours()+d.getMinutes()/60;
$('#clk').textContent=('0'+d.getHours()).slice(-2)+' h '+('0'+d.getMinutes()).slice(-2);
$('#bar').style.setProperty('--p',(d.getMinutes()/60*100)+'%');sky(h);
if(!st.free&&cur>-1&&hourPick()!==cur&&!st.sheet)show(hourPick(),false)}
/* ciel selon l'heure */
var KF=[[0,['#0b1026','#1b1f4b','#3a2a6b']],[5,['#1c2150','#7a4a8a','#e08a7c']],[8,['#35629a','#7fb0d8','#f0d8b8']],[12,['#285d9e','#4a8fcb','#8fc4e8']],[17,['#34286a','#c9587a','#f4a25c']],[20,['#101436','#2a2766','#5a3a86']],[24,['#0b1026','#1b1f4b','#3a2a6b']]];
function hx(c){return[1,3,5].map(function(i){return parseInt(c.substr(i,2),16)})}
function mix(a,b,f){var A=hx(a),B=hx(b);return'rgb('+A.map(function(v,i){return Math.round(v+(B[i]-v)*f)}).join(',')+')'}
function sky(h){for(var i=0;i<KF.length-1;i++){if(h>=KF[i][0]&&h<=KF[i+1][0]){var f=(h-KF[i][0])/(KF[i+1][0]-KF[i][0]),r=document.documentElement.style;['a','b','c'].forEach(function(k,j){r.setProperty('--'+k,mix(KF[i][1][j],KF[i+1][1][j],f))});break}}
var day=h>=6&&h<18,u=((h-6+24)%24)%12/12,th=Math.PI*(1-u),o=$('#orb');
o.style.left=(50+40*Math.cos(th))+'%';o.style.top=(58-42*Math.sin(th))+'%';
o.style.background=day?'radial-gradient(circle,#fff6d0,rgba(255,200,120,.55) 45%,transparent 70%)':'radial-gradient(circle,#f2f6ff,rgba(160,180,255,.4) 45%,transparent 70%)';
var n=(h>=20||h<5)?1:(h>=18?(h-18)/2:(h<7?(7-h)/2:0));document.querySelectorAll('.star').forEach(function(s){s.style.opacity=Math.max(0,n)})}
var sk=$('#sky');for(var k=0;k<46;k++){var s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*70+'%';s.style.animationDelay=(Math.random()*4)+'s';s.style.transform='scale('+(.6+Math.random()*1.2)+')';sk.appendChild(s)}
/* actions */
$('#bN').onclick=nextQ;
$('#bH').onclick=function(){var t=ALL[cur][0],i=st.fav.indexOf(t);if(i>-1)st.fav.splice(i,1);else{st.fav.push(t);toast('Ajoutée aux favoris')}saveFav();paint(cur)};
$('#bC').onclick=function(){var x=ALL[cur],tx='«\u00a0'+x[0]+'\u00a0»'+(x[1]?'\n— '+x[1]:'');if(navigator.share){navigator.share({text:tx}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(tx).then(function(){toast('Citation copiée')})}};
var sh=$('#sheet');
function dl(n,t){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=n;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800)}
function sheet(){
var h='<h2>Thèmes</h2><div class="chips">'+['Tous'].concat(TH).map(function(n,i){return'<button class="chip'+(st.th===i-1?' on':'')+'" data-t="'+(i-1)+'">'+n+'</button>'}).join('')+'</div>';
h+='<div class="row" style="margin:0 0 16px"><button class="pb" id="hr">Revenir à la citation de l’heure</button></div>';
h+='<h2>Favoris ('+st.fav.length+')</h2>';
st.fav.forEach(function(t,i){var x=ALL.filter(function(y){return y[0]===t})[0]||[t,''];h+='<div class="fv"><button data-r="'+i+'" aria-label="Retirer">♥</button>'+x[0].replace(/</g,'&lt;')+(x[1]?'<small>'+x[1]+'</small>':'')+'</div>'});
if(!st.fav.length)h+='<div class="fv" style="opacity:.6">Touche ♡ pour garder une citation ici.</div>';
h+='<div class="row"><button class="pb" id="bk">Sauvegarder mes favoris</button><button class="pb" id="rs">Restaurer</button><button class="pb" id="cl">Fermer</button></div><input type="file" id="fi" accept=".json,application/json" hidden>';
sh.innerHTML=h;sh.classList.add('open');st.sheet=1}
function closeS(){sh.classList.remove('open');st.sheet=0}
$('#bF').onclick=sheet;
sh.onclick=function(e){var b=e.target.closest('button');if(!b)return;
if(b.dataset.t!==undefined){st.th=+b.dataset.t;st.bag=[];sheet();return}
if(b.dataset.r!==undefined){st.fav.splice(+b.dataset.r,1);saveFav();sheet();paint(cur);return}
if(b.id==='cl'){closeS()}else if(b.id==='hr'){closeS();goHour()}else if(b.id==='bk'){dl('citations-favoris.json',JSON.stringify({app:'citations',fav:st.fav}));toast('Sauvegarde téléchargée')}else if(b.id==='rs'){$('#fi').click();$('#fi').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||!Array.isArray(o.fav))throw 0;o.fav.forEach(function(t){if(typeof t==='string'&&st.fav.indexOf(t)<0)st.fav.push(t)});saveFav();sheet();paint(cur);toast('Favoris restaurés')}catch(e){toast('Fichier invalide')}};r.readAsText(f)}}};
/* gestes */
var tx=0,ty=0;document.addEventListener('touchstart',function(e){if(st.sheet)return;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(e){if(st.sheet)return;var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<50)return;if(Math.abs(dy)>Math.abs(dx)){dy<0?nextQ():prevQ()}else{dx<0?nextQ():prevQ()}},{passive:true});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowUp')nextQ();else if(e.key==='ArrowLeft'||e.key==='ArrowDown')prevQ()});
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
tick();paint(hourPick());setInterval(tick,20000);
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js')}catch(e){}
})();
</script>
